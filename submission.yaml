submission:
  title: "BoB AI Ops: Predictive Port Operations Control Centre"

  problem_statement: >
    Port congestion leads to massive supply chain delays and demurrage costs. Port supervisors struggle to optimally assign vessels to berths and cranes in real-time due to cascading delays and equipment faults.

  solution_summary: >
    A predictive decision-support system that simulates port states up to 72 hours in advance and provides deterministic algorithmic recommendations (reassignments) to optimize berth and crane utilization.

  key_features:
    - "Real-Time Resource Conflict Engine"
    - "Deterministic Algorithmic Reassignment Optimization"
    - "Predictive What-If Simulator"
    - "Operations Copilot Briefing"
    - "72-Hour Lookahead Planning"

  tech_stack:
    languages: ["TypeScript", "HTML", "CSS"]
    frameworks: ["React", "Vite", "Tailwind CSS"]
    ibm_technologies: []
    databases: []
    other: ["Zustand", "Lucide-React", "Recharts"]

  what_we_are_most_proud_of: >
    The Algorithmic Reassignment Engine, which mathematically evaluates capacity constraints, ETAs, and crane availability to propose deterministic solutions instead of relying on generic LLM outputs.

  known_limitations: >
    Offline POC with simulated synthetic data. Backend APIs are mocked via Zustand store.

